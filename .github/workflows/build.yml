name: Build Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: mylt-linux
            artifact: dist/mylt-linux
            extra_args: ""
          - os: macos-14
            name: mylt-macos
            artifact: dist/mylt-macos
            extra_args: "--target-architecture universal2"
          - os: windows-latest
            name: mylt-windows
            artifact: dist/mylt-windows.exe
            extra_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name ${{ matrix.name }} ${{ matrix.extra_args }} app.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
