name: Build Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: mylt-linux
            artifact: dist/mylt-linux.zip
          - os: macos-15
            name: mylt-macos-arm64
            artifact: dist/mylt-macos-arm64.zip
          - os: macos-15-intel
            name: mylt-macos-intel
            artifact: dist/mylt-macos-intel.zip
          - os: windows-latest
            name: mylt-windows
            artifact: dist/mylt-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build binary
        run: pyinstaller --onefile --name ${{ matrix.name }} app.py

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/${{ matrix.name }}
          cd dist && zip -r ${{ matrix.name }}.zip ${{ matrix.name }}

      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: |
          mv dist/${{ matrix.name }} dist/${{ matrix.name }}.command
          chmod +x dist/${{ matrix.name }}.command
          cd dist && zip -r ${{ matrix.name }}.zip ${{ matrix.name }}.command

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.name }}.exe -DestinationPath dist/${{ matrix.name }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
