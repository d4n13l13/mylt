name: Build Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: mylt-linux
            artifact: dist/mylt-linux.zip
          - os: macos-15
            name: mylt-macos-arm64
            artifact: dist/mylt-macos-arm64.zip
          - os: macos-15-intel
            name: mylt-macos-intel
            artifact: dist/mylt-macos-intel.zip
          - os: windows-latest
            name: mylt-windows
            artifact: dist/mylt-windows.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller certifi

      - name: Build binary
        run: pyinstaller --onefile --name ${{ matrix.name }} app.py

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          mv dist/${{ matrix.name }} AppDir/usr/bin/mylt
          chmod +x AppDir/usr/bin/mylt

          cat << 'EOF' > AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          BIN="$HERE/usr/bin/mylt"

          if [ -t 0 ]; then
            exec "$BIN" "$@"
          fi

          for term in x-terminal-emulator gnome-terminal konsole xfce4-terminal mate-terminal alacritty kitty xterm; do
            if command -v "$term" >/dev/null 2>&1; then
              if [ "$term" = "gnome-terminal" ]; then
                exec "$term" -- "$BIN" "$@"
              else
                exec "$term" -e "$BIN" "$@"
              fi
            fi
          done
          EOF
          chmod +x AppDir/AppRun

          cat << 'EOF' > AppDir/mylt.desktop
          [Desktop Entry]
          Type=Application
          Name=My Little Terminal
          Exec=AppRun
          Icon=mylt
          Terminal=true
          Categories=Utility;TerminalEmulator;
          EOF

          python3 -c 'import base64; open("AppDir/mylt.png", "wb").write(base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="))'

          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "dist/My-Little-Terminal-x86_64.AppImage"
          chmod +x "dist/My-Little-Terminal-x86_64.AppImage"
          cd dist && zip -r ${{ matrix.name }}.zip My-Little-Terminal-x86_64.AppImage

      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: |
          APP_DIR="dist/My Little Terminal.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          mv "dist/${{ matrix.name }}" "$APP_DIR/Contents/MacOS/mylt-bin"
          chmod +x "$APP_DIR/Contents/MacOS/mylt-bin"

          cat << 'EOF' > "$APP_DIR/Contents/MacOS/launcher"
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          osascript -e "tell application \"Terminal\" to do script \"'$DIR/mylt-bin'; exit\"" -e "tell application \"Terminal\" to activate"
          EOF
          chmod +x "$APP_DIR/Contents/MacOS/launcher"

          cat << 'EOF' > "$APP_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>launcher</string>
            <key>CFBundleIdentifier</key>
            <string>com.d4n13l13.mylt</string>
            <key>CFBundleName</key>
            <string>My Little Terminal</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
          </dict>
          </plist>
          EOF

          [ -f icon.icns ] && cp icon.icns "$APP_DIR/Contents/Resources/icon.icns"
          cd dist && zip -r "${{ matrix.name }}.zip" "My Little Terminal.app"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/${{ matrix.name }}.exe -DestinationPath dist/${{ matrix.name }}.zip

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
